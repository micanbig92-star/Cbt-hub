<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b55">
<title>MICAN CBT HUB | School Examination Portal</title>
<style>
:root{--school-color:#2563eb;font-family:Arial,sans-serif;color:#17243b;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--school-color);color:white;font-weight:bold}
button.secondary{background:#e8eef8;color:#174b91}
button.danger{background:#b83245}
button:disabled{opacity:.5;cursor:not-allowed}
.top{background:var(--school-color);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:22px;font-weight:850}
.brand small{display:block;font-size:11px;opacity:.75}
.wrap{max-width:1100px;margin:28px auto;padding:0 16px}
.panel{background:white;border:1px solid #e3eaf3;border-radius:16px;padding:20px;margin-bottom:17px}
.auth{max-width:460px;margin:8vh auto}
.muted{color:#718096}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{padding:17px;border-radius:13px;background:#f2f6fc}
.stat b{display:block;font-size:28px;color:#174b91}
.stat span{font-size:13px;color:#718096}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button{background:#e8eef8;color:#174b91}
.tabs button.active{background:#174b91;color:white}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5deea;border-radius:9px;background:white}
textarea{min-height:75px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.item,.question{border:1px solid #e3eaf3;border-radius:11px;padding:13px;margin:9px 0}
.pill{display:inline-block;background:#eaf1fb;color:#174b91;padding:4px 9px;border-radius:30px;font-size:12px}
.option{display:flex;gap:9px;align-items:center;padding:8px}
.option input{width:auto}
.timer{font-size:22px;font-weight:bold;color:#b83245}
.error{padding:11px;border-radius:9px;background:#ffebee;color:#a21e32;margin:12px 0}
.loading{text-align:center;padding:50px;color:#718096}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawing-wrap{border:1px solid #cbd5e1;border-radius:12px;padding:10px;background:#f8fafc;margin:12px 0}
#drawingCanvas{display:block;width:100%;height:280px;background:white;border:1px solid #cbd5e1;border-radius:8px;touch-action:none;cursor:crosshair}
.draw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.draw-tools input[type=color]{width:45px;height:40px;padding:2px}
.draw-tools input[type=range]{width:110px}
.question-image{display:block;max-width:100%;max-height:320px;object-fit:contain;margin:12px 0;border:1px solid #e3eaf3;border-radius:9px;background:white}
@media(max-width:600px){
 .top{padding:15px;align-items:flex-start;flex-direction:column}
 .wrap{margin:16px auto}
 .panel{padding:16px}
 #drawingCanvas{height:230px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading CBT HUB…</div></div>


<script>
const app=document.getElementById("app");
let me=null,tab="overview",exam=null,answers={},timerId=null,saveId=null;
let examSecondsRemaining=0,examSubjectIndex=0,examQuestionIndex=0;
let drawingData="";
let schoolBranding={schoolName:"MICAN CBT HUB",primaryColor:"#2563eb",academicSession:"",term:""};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function api(url,opts={}){
 const r=await fetch(url,{
  credentials:"same-origin",
  headers:{"Content-Type":"application/json",...(opts.headers||{})},
  ...opts
 });
 let d={};
 try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

async function loadSchoolBranding(){
 try{
  schoolBranding=await api("/api/school-branding");
  document.documentElement.style.setProperty(
    "--school-color",
    /^#[0-9a-fA-F]{6}$/.test(schoolBranding.primaryColor || "")
      ? schoolBranding.primaryColor
      : "#2563eb"
  );
  document.title=(schoolBranding.schoolName||"MICAN CBT HUB")+" | School Examination Portal";
 }catch(e){
  console.warn("School branding could not be loaded:",e.message);
 }
}

function headerBar(){
 return `<header class="top">
  <div class="brand"><span id="portalSchoolName">${esc(schoolBranding.schoolName||"MICAN CBT HUB")}</span><small>SCHOOL EXAMINATION PORTAL</small></div>
  <div class="right">${me?`
   <span>${esc(me.username)} · ${esc(me.role)}</span>
   <button class="secondary" onclick="logout()">Logout</button>`:""}
  </div>
 </header>`;
}

function shell(body){
 app.innerHTML=headerBar()+`<main class="wrap">${body}</main>`;
}

function errorBox(message){
 return `<div class="error">${esc(message)}</div>`;
}

async function init(){
 try{
  await loadSchoolBranding();
  app.innerHTML='<div class="loading">Checking CBT HUB...</div>';
  const status=await api("/api/status");
  me=status.user;

  if(!me){
   authScreen(status.setup);
   return;
  }

  if(me.role==="student")studentHome();
  else dashboard();
 }catch(e){
  shell(`<section class="panel">
   <h2>Unable to load CBT HUB</h2>
   ${errorBox(e.message)}
   <button onclick="init()">Try again</button>
  </section>`);
 }
}

function authScreen(setup){
 const adminForm=setup?`
  <h2>Create administrator account</h2>
  <p class="muted">This first account becomes the CBT HUB administrator.</p>
  <form onsubmit="login(event,true)">
   <label>Admin username</label>
   <input name="username" required minlength="3">
   <label>Password (at least 10 characters)</label>
   <input name="password" type="password" required minlength="10">
   <button style="width:100%;margin-top:16px">Create admin account</button>
  </form>`:`
  <h2>Sign in</h2>
  <form onsubmit="login(event,false)">
   <label>Username</label>
   <input name="username" required minlength="3">
   <label>Password</label>
   <input name="password" type="password" required>
   <button style="width:100%;margin-top:16px">Sign in</button>
  </form>
  <hr style="border:0;border-top:1px solid #e3eaf3;margin:22px 0">
  <h2>New student?</h2>
  <p class="muted">Create your own student account to take examinations.</p>
  <form onsubmit="registerStudent(event)">
   <label>Choose username</label>
   <input name="username" required minlength="3" autocomplete="username">
   <label>Create password (at least 8 characters)</label>
   <input name="password" type="password" required minlength="8" autocomplete="new-password">
   <label>Class</label>
   <input name="className" placeholder="Example: SS2">
   <button class="secondary" style="width:100%;margin-top:14px">Create student account</button>
  </form>`;

 shell(`<section class="panel auth">
  <h1>Welcome to CBT HUB</h1>
  ${adminForm}
 </section>`);
}

async function login(event,isSetup){
 event.preventDefault();
 const form=new FormData(event.target);

 try{
  const data=await api(isSetup?"/api/setup":"/api/login",{
   method:"POST",
   body:JSON.stringify(Object.fromEntries(form))
  });
  me=data.user;
  tab="overview";
  init();
 }catch(e){alert(e.message)}
}

async function registerStudent(event){
 event.preventDefault();
 const form=new FormData(event.target);

 try{
  const data=await api("/api/student/register",{
   method:"POST",
   body:JSON.stringify({
    username:form.get("username"),
    password:form.get("password"),
    className:form.get("className")
   })
  });

  me=data.user;
  studentHome();
 }catch(e){alert(e.message)}
}

async function logout(){
 try{
  await api("/api/logout",{method:"POST"});
  me=null;
  exam=null;
  clearInterval(timerId);
  clearInterval(saveId);
  init();
 }catch(e){alert(e.message)}
}

function dashboard(){
 if(!me||!["admin","teacher"].includes(me.role)){
  return studentHome();
 }

 const tabs=me.role==="admin"
  ?["overview","users","questions","exams","timetable","certificates","results","school-settings"]
  :["overview","questions","exams","results"];

 if(!tabs.includes(tab))tab="overview";

 shell(`<h1>${me.role==="admin"?"Admin dashboard":"Teacher dashboard"}</h1>
 <p class="muted">Manage examination activities.</p>
 <nav class="tabs">
 ${tabs.map(t=>`
  <button class="${tab===t?"active":""}" onclick="tab='${t}';dashboard()">
   ${t==="school-settings"?"School Settings":t[0].toUpperCase()+t.slice(1)}
  </button>`).join("")}
 </nav>
 <div id="content"></div>`);

 loadTab();
}

async function loadTab(){
 const el=document.getElementById("content");
 if(!el)return;

 try{
  if(tab==="overview"){
   const [users,questions,exams,results]=await Promise.all([
    me.role==="admin"?api("/api/users"):Promise.resolve([]),
    api("/api/questions"),
    api("/api/exams"),
    api("/api/results")
   ]);

   el.innerHTML=`<div class="grid">
    <div class="stat"><b>${me.role==="admin"?users.length:"—"}</b><span>Accounts</span></div>
    <div class="stat"><b>${questions.length}</b><span>Questions</span></div>
    <div class="stat"><b>${exams.length}</b><span>Your exams</span></div>
    <div class="stat"><b>${results.length}</b><span>Results</span></div>
   </div>
   <section class="panel">
    <h2>Welcome, ${esc(me.username)}</h2>
    <p class="muted">Choose a section above to manage CBT activities.</p>
   </section>`;
  }

  if(tab==="users")await users(el);
  if(tab==="questions")await questions(el);
  if(tab==="exams")await exams(el);
  if(tab==="timetable"&&me.role==="admin")await timetable(el);
  if(tab==="certificates"&&me.role==="admin")await certificates(el);
  if(tab==="results")await results(el);
  if(tab==="school-settings"&&me.role==="admin")await schoolSettings(el);

 }catch(e){
  el.innerHTML=errorBox(e.message);
 }
}

// ADMIN USER MANAGEMENT

async function schoolSettings(el){
 if(me.role!=="admin")return;

 const settings=await api("/api/school-settings");

 el.innerHTML=`
 <section class="panel">
  <h2>School Settings</h2>
  <p class="muted">Customize your school's examination portal.</p>
  <form id="schoolSettingsForm">
   <label>School logo</label>
   ${settings.schoolLogo?`<img src="${esc(settings.schoolLogo)}" alt="Current school logo" style="display:block;max-width:150px;max-height:110px;object-fit:contain;margin:10px 0">`:"<p class='muted'>No logo uploaded yet.</p>"}
   <input type="hidden" name="schoolLogo" value="${esc(settings.schoolLogo||"")}">
   <input name="schoolLogoFile" type="file" accept="image/png,image/jpeg,image/webp">
   <label><input type="checkbox" name="clearSchoolLogo"> Remove current logo</label>
   <label>School name</label>
   <input name="schoolName" maxlength="100" required value="${esc(settings.schoolName||"")}">

   <label>School colour</label>
   <input name="primaryColor" type="color" value="${esc(settings.primaryColor||"#2563eb")}">

   <label>Academic session</label>
   <input name="academicSession" maxlength="30" placeholder="2026/2027" value="${esc(settings.academicSession||"")}">

   <label>Current term</label>
   <input name="term" maxlength="30" placeholder="First Term" value="${esc(settings.term||"")}">

   <button type="submit">Save School Settings</button>
  </form>
 </section>`;

 document.getElementById("schoolSettingsForm").onsubmit=async function(e){
  e.preventDefault();
  const form=e.target;
  const data=Object.fromEntries(new FormData(form).entries());
  const file=form.elements.schoolLogoFile.files[0];
  delete data.schoolLogoFile;
  delete data.clearSchoolLogo;

  if(form.elements.clearSchoolLogo.checked){
   data.schoolLogo="";
  }else if(file){
   if(!["image/png","image/jpeg","image/webp"].includes(file.type)){
    alert("Please choose a PNG, JPG or WebP image.");
    return;
   }
   if(file.size>1400000){
    alert("Please choose a logo smaller than 1.4 MB.");
    return;
   }
   data.schoolLogo=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("Could not read the logo image."));
    reader.readAsDataURL(file);
   });
  }

  try{
   await api("/api/school-settings",{
    method:"PUT",
    body:JSON.stringify(data)
   });
   await loadSchoolBranding();
   alert("School settings saved successfully.");
   await schoolSettings(el);
  }catch(error){
   alert(error.message);
  }
 };
}


function startCertificateSignature(event){
 event.preventDefault();
 const canvas=event.currentTarget;
 canvas.setPointerCapture(event.pointerId);
 const rect=canvas.getBoundingClientRect();
 const x=(event.clientX-rect.left)*canvas.width/rect.width;
 const y=(event.clientY-rect.top)*canvas.height/rect.height;
 const ctx=canvas.getContext("2d");
 ctx.strokeStyle="#14213d";
 ctx.lineWidth=5;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.beginPath();
 ctx.moveTo(x,y);
 window.certificateSignatureDrawn=true;
}

function drawCertificateSignature(event){
 const canvas=event.currentTarget;
 if(!canvas.hasPointerCapture(event.pointerId))return;
 event.preventDefault();
 const rect=canvas.getBoundingClientRect();
 const x=(event.clientX-rect.left)*canvas.width/rect.width;
 const y=(event.clientY-rect.top)*canvas.height/rect.height;
 const ctx=canvas.getContext("2d");
 ctx.lineTo(x,y);
 ctx.stroke();
}

function stopCertificateSignature(event){
 const canvas=event.currentTarget;
 if(canvas.hasPointerCapture(event.pointerId)){
  canvas.releasePointerCapture(event.pointerId);
 }
}

function clearCertificateSignature(){
 const canvas=document.getElementById("certificateSignaturePad");
 if(!canvas)return;
 canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
 window.certificateSignatureDrawn=false;
}

 ]);
 const students=usersList.filter(u=>u.role==="student");

 el.innerHTML=`<section class="panel">
  <h2>Issue Examination Certificate</h2>
  <form onsubmit="issueCertificate(event)">
   <label>Student</label>
   <select name="studentId" required>
    <option value="">Choose student</option>
    ${students.map(u=>`<option value="${u.id}">${esc(u.username)} — ${esc(u.className||"No class")}</option>`).join("")}
   </select>
   <label>Examination title</label>
   <input name="examination" required maxlength="200">
   <label>Certificate details</label>
   <textarea name="details" maxlength="200" placeholder="Achievement or examination description"></textarea>
   <label>Authorised signatory name</label>
   <input name="signatory" required maxlength="200">
   <label>Signatory designation</label>
   <input name="designation" required maxlength="200" placeholder="Principal / Vice Rector">

   <label>Authorised signature</label>
   <p class="muted">Draw below with your finger or mouse, or upload a signature image.</p>
   <canvas id="certificateSignaturePad" width="900" height="240"
    style="display:block;width:100%;height:150px;background:#fff;border:2px solid #9ca3af;border-radius:8px;touch-action:none"
    onpointerdown="startCertificateSignature(event)"
    onpointermove="drawCertificateSignature(event)"
    onpointerup="stopCertificateSignature(event)"
    onpointercancel="stopCertificateSignature(event)"></canvas>
   <button type="button" class="secondary" onclick="clearCertificateSignature()">Clear drawing</button>
   <label>Or upload signature image</label>
   <input name="signatureFile" type="file" accept="image/png,image/jpeg,image/webp">
   <button ${students.length?"":"disabled"}>Issue Certificate</button>
  </form>
 </section>
 <section class="panel">
  <h2>Issued Certificates</h2>
  ${issued.map(c=>`<div class="item">
   <b>${esc(c.studentName)}</b>
   <p>${esc(c.examination)} · ${esc(c.className)}</p>
   <p>${new Date(c.issuedAt).toLocaleDateString()}</p>
   <button class="danger" onclick="deleteCertificate('${c.id}')">Revoke certificate</button>
  </div>`).join("")||"<p>No certificates issued yet.</p>"}
 </section>`;
}

async function issueCertificate(event){
 event.preventDefault();
 const form=event.target;
 const data=Object.fromEntries(new FormData(form).entries());
 const file=form.elements.signatureFile.files[0];
 delete data.signatureFile;

 try{
  if(file){
   if(!["image/png","image/jpeg","image/webp"].includes(file.type)){
    alert("Choose a PNG, JPG or WebP signature image.");
    return;
   }
   if(file.size>1000000){
    alert("Please use a signature image smaller than 1 MB.");
    return;
   }
   data.signatureImage=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error("Could not read the signature image."));
    reader.readAsDataURL(file);
   });
  }else{
   const canvas=document.getElementById("certificateSignaturePad");
   if(!window.certificateSignatureDrawn){
    alert("Please draw a signature or upload a signature image.");
    return;
   }
   data.signatureImage=canvas.toDataURL("image/png");
  }

  await api("/api/certificates",{
   method:"POST",
   body:JSON.stringify(data)
  });
  alert("Certificate issued successfully.");
  window.certificateSignatureDrawn=false;
  loadTab();
 }catch(e){alert(e.message)}
}

async function deleteCertificate(id){
 if(!confirm("Revoke this certificate?"))return;
 try{
  await api("/api/certificates/"+id,{method:"DELETE"});
  loadTab();
 }catch(e){alert(e.message)}
}

el.innerHTML=`<details class="panel" open>

  <div class="formgrid">

   <div><label>Temporary password</label><input name="password" required minlength="8"></div>
   <div><label>Role</label>
    <select name="role">
     <option value="student">Student</option>
     <option value="teacher">Teacher</option>
    </select>
   </div>
   <div><label>Class</label><input name="className" placeholder="SS2"></div>
  </div>
  <button>Create account</button>
 </form>
  </details>
 <details class="panel">
  <summary><b>Students by class</b></summary>
    ${studentHtml}
 </details>
 <details class="panel">
  <summary><b>Teachers</b></summary>
  ${teacherHtml}

 }

// DRAWING BOARD
function drawingBoard(){
 return `<div class="drawing-wrap">
  <b>Question drawing board</b>
  <p class="muted">Draw with your finger or mouse. Your drawing will be attached to this question.</p>
  <div class="draw-tools">
   <label style="margin:0">Pen colour</label>
   <input type="color" id="penColor" value="#17243b">
   <label style="margin:0">Pen size</label>
   <input type="range" id="penSize" min="1" max="18" value="3">
   <button type="button" class="secondary" onclick="setEraser(false)">Pen</button>
   <button type="button" class="secondary" onclick="setEraser(true)">Eraser</button>
   <button type="button" class="danger" onclick="clearDrawing()">Clear board</button>
  </div>
  <canvas id="drawingCanvas" width="1000" height="440"></canvas>
  <p class="muted">Optional: leave the board blank if the question does not need a diagram.</p>
 </div>`;
}

let canvasEraser=false;
let canvasDrawing=false;
let lastPoint=null;

function setupDrawingBoard(){
 const canvas=document.getElementById("drawingCanvas");
 if(!canvas)return;

 const ctx=canvas.getContext("2d");
 ctx.lineCap="round";
 ctx.lineJoin="round";

 canvas.addEventListener("pointerdown",event=>{
  canvasDrawing=true;
  canvas.setPointerCapture(event.pointerId);
  lastPoint=getCanvasPoint(canvas,event);
 });

 canvas.addEventListener("pointermove",event=>{
  if(!canvasDrawing||!lastPoint)return;

  const point=getCanvasPoint(canvas,event);
  ctx.beginPath();
  ctx.moveTo(lastPoint.x,lastPoint.y);
  ctx.lineTo(point.x,point.y);
  ctx.lineWidth=Number(document.getElementById("penSize")?.value||3);
  ctx.strokeStyle=document.getElementById("penColor")?.value||"#17243b";
  ctx.globalCompositeOperation=canvasEraser?"destination-out":"source-over";
  ctx.stroke();
  lastPoint=point;
 });

 function stopDrawing(){
  canvasDrawing=false;
  lastPoint=null;
  ctx.globalCompositeOperation="source-over";
 }

 canvas.addEventListener("pointerup",stopDrawing);
 canvas.addEventListener("pointercancel",stopDrawing);
 canvas.addEventListener("lostpointercapture",stopDrawing);
}

function getCanvasPoint(canvas,event){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(event.clientX-rect.left)*(canvas.width/rect.width),
  y:(event.clientY-rect.top)*(canvas.height/rect.height)
 };
}

function filterQuestions(){
 const query=String(document.getElementById("questionSearch")?.value||"").trim().toLowerCase();
 let visible=0;

 document.querySelectorAll(".question-bank-item").forEach(item=>{
  const match=item.dataset.search.includes(query);
  item.hidden=!match;
  if(match)visible++;
 });

 const empty=document.getElementById("questionSearchEmpty");
 if(empty)empty.hidden=visible!==0;
}

async function editQuestion(id){
 try{
  const list=await api("/api/questions");
  const q=list.find(item=>item.id===id);
  if(!q)throw Error("Question not found.");

  const text=prompt("Edit question",q.text);
  if(text===null)return;

  const options=[];
  for(let i=0;i<4;i++){
   const value=prompt("Edit option "+ "ABCD"[i],q.options[i]);
   if(value===null)return;
   options.push(value);
  }

  const answerText=prompt("Correct option (A, B, C or D)","ABCD"[q.answer]||"A");
  if(answerText===null)return;
  const answer="ABCD".indexOf(answerText.trim().toUpperCase());
  if(answer<0)throw Error("Enter A, B, C or D.");

  const subject=prompt("Subject",q.subject||"");
  if(subject===null)return;
  const className=prompt("Class",q.className||"");
  if(className===null)return;
  const topic=prompt("Topic",q.topic||"");
  if(topic===null)return;

  await api("/api/questions/"+id,{
   method:"PATCH",
   body:JSON.stringify({
    text,options,answer,subject,className,topic,image:q.image||""
   })
  });

  alert("Question updated.");
  loadTab();
 }catch(e){alert(e.message)}
}

async function addQuestion(event){
 event.preventDefault();

 const form=new FormData(event.target);
 const canvas=document.getElementById("drawingCanvas");
 let image="";

 if(canvas){
  const ctx=canvas.getContext("2d");
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let hasDrawing=false;

  for(let i=3;i<pixels.length;i+=4){
   if(pixels[i]!==0){hasDrawing=true;break}
  }

  if(hasDrawing)image=canvas.toDataURL("image/png");
 }

 try{
  await api("/api/questions",{
   method:"POST",
   body:JSON.stringify({
    text:form.get("text"),
    options:[0,1,2,3].map(i=>form.get("o"+i)),
    answer:form.get("answer"),
    subject:form.get("subject"),
    className:form.get("className"),
    topic:form.get("topic"),
    image
   })
  });

  alert("Question saved successfully.");
  loadTab();
 }catch(e){alert(e.message)}
}

 async function results(el){
 const list=await api("/api/results");

 const examsMap=new Map();

 list.forEach(r=>{
  if(!examsMap.has(r.exam))examsMap.set(r.exam,[]);
  examsMap.get(r.exam).push(r);
 });
  const rankingHtml=[...examsMap.entries()].map(([examName,rows])=>{
   const classGroups=new Map();

   rows.forEach(r=>{
    const className=String(r.className||"Class not recorded").trim();
    if(!classGroups.has(className))classGroups.set(className,[]);
    classGroups.get(className).push(r);
   });

   const classRankingHtml=[...classGroups.entries()]
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([className,classRows])=>{
     classRows.sort((a,b)=>Number(b.percentage)-Number(a.percentage));

     return `<details class="item" open>
      <summary><b>${esc(className)}</b> — ${classRows.length} result(s)</summary>
      <div style="margin-top:10px">
       ${classRows.map((r,i)=>`
        <p>${i+1}. ${esc(r.student)} — ${r.score}/${r.total} (${r.percentage}%)</p>
       `).join("")}
      </div>
     </details>`;
    }).join("");

   return `<div class="item">
    <b>${esc(examName)} — Student rankings by class</b>
    ${classRankingHtml}
   </div>`;
  }).join("");

 const classes=new Map();

 list.forEach(r=>{
  const key=r.className||"Class not recorded";
  if(!classes.has(key))classes.set(key,[]);
  classes.get(key).push(Number(r.percentage)||0);
 });

 const averagesHtml=[...classes.entries()].map(([name,scores])=>{
  const average=scores.reduce((sum,value)=>sum+value,0)/scores.length;

  return `<div class="item">
   <b>${esc(name)}</b>
   <p>Class average: ${average.toFixed(1)}% · ${scores.length} result(s)</p>
  </div>`;
 }).join("");

    <p><b>Overall grade:</b> ${esc(r.overallGrade)}</p>
    <p><b>Class position:</b> ${r.classPosition} of ${r.classSize}</p>
    <p style="margin-top:35px">________________________<br>Class Teacher's Signature</p>
   </article>`).join("")||"<p class='muted'>No report cards are available yet.</p>"}
   ${reports.length?'<button onclick="window.print()">Print / Save as PDF</button>':""}
  </section>
  <style>@media print{
   body{background:white!important}
   button{display:none!important}
   .report-card{break-inside:avoid;border:1px solid #999!important;color:#111!important;background:white!important}
  }</style>`);
 }catch(e){
  shell(`<section class="panel"><h2>Unable to load report cards</h2>
   ${errorBox(e.message)}
   <button class="secondary" onclick="studentHome()">Back</button></section>`);
 }
}

async function startExam(event) {
  event.preventDefault();

  const code = String(
    new FormData(event.target).get("code") || ""
  ).trim().toUpperCase();

  try {
    const info = await api("/api/student/subjects", {
      method: "POST",
      body: JSON.stringify({ code })
    });

    if (info.subjects.length >= 4) {
      showSubjectPicker(code, info);
    } else {
      await beginStudentExam(code, []);
    }

  } catch (e) {
    alert(e.message);
  }
}

function showSubjectPicker(code, info) {
  shell(`<section class="panel">
    <h1>Choose your subjects</h1>

    <p><b>${esc(info.title)}</b></p>

    <p class="muted">
      Select at least four subjects.
      The ${info.duration}-minute timer covers all four subjects together.
    </p>

    <form onsubmit="beginSelectedSubjects(event, '${code}')">

      ${info.subjects.map(subject => `
        <label class="option">
          <input type="checkbox" name="subjects" value="${esc(subject)}">
          ${esc(subject)}
        </label>
      `).join("")}

      <button style="margin-top:12px">
        Start examination
      </button>

      <button type="button" class="secondary"
        onclick="studentHome()">
        Cancel
      </button>

    </form>
  </section>`);
}

async function beginSelectedSubjects(event, code) {
  event.preventDefault();

  const subjects = new FormData(event.target).getAll("subjects");

  if (subjects.length < 4) {
    alert("Please select at least four subjects.");
    return;
  }

  await beginStudentExam(code, subjects);
}

async function beginStudentExam(code, subjects) {
  try {
    exam = await api("/api/student/start", {
      method: "POST",
      body: JSON.stringify({
        code,
        subjects
      })
    });

    answers = { ...exam.answers };
    renderExam();

  } catch (e) {
    alert(e.message);
  }
}

// STUDENT EXAM DISPLAY
function renderExam(){
 clearInterval(timerId);
 clearInterval(saveId);

 examSecondsRemaining = Number.isFinite(Number(exam.remainingSeconds))
  ? Number(exam.remainingSeconds)
  : exam.duration * 60;

 examSubjectIndex = 0;
 examQuestionIndex = 0;

 renderExamPage();

 timerId=setInterval(()=>{
  examSecondsRemaining = Math.max(0, examSecondsRemaining - 1);
  const timer=document.getElementById("timer");

  if(timer){
   timer.textContent=
    Math.floor(examSecondsRemaining/60)+":"+
    String(examSecondsRemaining%60).padStart(2,"0");
  }

  if(examSecondsRemaining<=0){
   clearInterval(timerId);
   submitExam(true);
  }
 },1000);

 saveId=setInterval(()=>{
  if(exam){
   api("/api/student/save",{
    method:"POST",
    body:JSON.stringify({
     examId:exam.examId,
     answers
    })
   }).catch(()=>{});
  }
 },15000);
}

function renderExamPage(){
 if(!exam)return;

 const subjectNames = exam.selectedSubjects?.length
  ? exam.selectedSubjects
  : [...new Set(exam.questions.map(q=>q.subject || "General"))];

 const subject = subjectNames[examSubjectIndex];
 const questions = exam.questions.filter(q=>
  (q.subject || "General") === subject
 );

 if(!questions.length){
  alert("No questions found for this subject.");
  return;
 }

 examQuestionIndex = Math.min(
  examQuestionIndex,
  questions.length - 1
 );

 const q = questions[examQuestionIndex];

 shell(`<section class="panel">
  <div class="row" style="justify-content:space-between">
   <div>
    <h1>${esc(exam.title)}</h1>
    <p class="muted">Subject ${examSubjectIndex+1} of ${subjectNames.length}</p>
   </div>
   <div class="timer" id="timer">
    ${Math.floor(examSecondsRemaining/60)}:${String(examSecondsRemaining%60).padStart(2,"0")}
   </div>
  </div>

  <h2>${esc(subject)}</h2>

  <div class="row" style="flex-wrap:wrap">
   ${subjectNames.map((name,i)=>`
    <button type="button"
     class="${i===examSubjectIndex?"":"secondary"}"
     onclick="changeExamSubject(${i})">
     ${esc(name)}
    </button>
   `).join("")}
  </div>

  <p class="muted">
   Question ${examQuestionIndex+1} of ${questions.length}
   in this subject
  </p>

  <div class="question">
   <b>${examQuestionIndex+1}. ${esc(q.text)}</b>
   ${q.image?`<img class="question-image" src="${q.image}" alt="Question diagram">`:""}
   ${q.options.map((option,j)=>`
    <label class="option">
     <input type="radio" name="currentAnswer" value="${j}"
      ${String(answers[q.id])===String(j)?"checked":""}
      onchange="answers['${q.id}']=this.value">
     ${"ABCD"[j]}. ${esc(option)}
    </label>
   `).join("")}
  </div>

  <div class="row" style="justify-content:space-between;flex-wrap:wrap">
   <button type="button" class="secondary"
    onclick="changeExamQuestion(-1)"
    ${examQuestionIndex===0?"disabled":""}>
    Previous question
   </button>

   <button type="button"
    onclick="changeExamQuestion(1)"
    ${examQuestionIndex===questions.length-1?"disabled":""}>
    Next question
   </button>
  </div>

  <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-top:12px">
   <button type="button" class="secondary"
    onclick="changeExamSubject(-1)"
    ${examSubjectIndex===0?"disabled":""}>
    Previous subject
   </button>

   <button type="button"
    onclick="changeExamSubject(1)"
    ${examSubjectIndex===subjectNames.length-1?"disabled":""}>
    Next subject
   </button>
  </div>

  <button type="button" onclick="submitExam()"
   style="margin-top:16px">
   Submit exam
  </button>
 </section>`);
}

function changeExamSubject(index){
 if(!exam)return;

 const subjectNames = exam.selectedSubjects?.length
  ? exam.selectedSubjects
  : [...new Set(exam.questions.map(q=>q.subject || "General"))];

 if(index<0 || index>=subjectNames.length)return;

 examSubjectIndex=index;
 examQuestionIndex=0;
 renderExamPage();
}

function changeExamQuestion(direction){
 if(!exam)return;

 const subjectNames = exam.selectedSubjects?.length
  ? exam.selectedSubjects
  : [...new Set(exam.questions.map(q=>q.subject || "General"))];

 const subject=subjectNames[examSubjectIndex];
 const questions=exam.questions.filter(q=>
  (q.subject || "General")===subject
 );

 const next=examQuestionIndex+direction;
 if(next<0 || next>=questions.length)return;

 examQuestionIndex=next;
 renderExamPage();
}

async function submitExam(auto=false){
 if(!exam)return;
document.documentElement.style.setProperty(
  "--school-color",
  /^#[0-9a-fA-F]{6}$/.test(schoolBranding.primaryColor || "")
    ? schoolBranding.primaryColor
    : "#2563eb"
); if(!auto&&!confirm("Submit your exam now?"))return;

 const submittedExam=exam;

 try{
  const result=await api("/api/student/submit",{
   method:"POST",
   body:JSON.stringify({
    examId:submittedExam.examId,
    answers
   })
  });

  clearInterval(timerId);
  clearInterval(saveId);
  exam=null;

  shell(`<section class="panel">
   <h1>Exam submitted</h1>
   <div class="stat">
    <b>${result.score}/${result.total}</b>
    <span>Your score · ${result.percentage}%</span>
   </div>
   <p>Your answers have been submitted successfully.</p>

${result.subjectScores
  ? '<h2>Subject scores</h2>' +
    Object.entries(result.subjectScores).map(([subject, score]) => `
      <div class="item">
        <b>${esc(subject)}</b>
        <p>${score.score}/${score.total} questions</p>
      </div>
    `).join("")
  : ""}

<button onclick="studentHome()">Back to portal</button>
  </section>`);
 }catch(e){
  alert(e.message);
 }
}

init();
</script>
</body>
</html>
