<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b55">
<title>CBT HUB | School Examination Portal</title>
<style>
:root{font-family:Arial,sans-serif;color:#17243b;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#174b91;color:white;font-weight:bold}
button.secondary{background:#e8eef8;color:#174b91}
button.danger{background:#b83245}
button:disabled{opacity:.5;cursor:not-allowed}
.top{background:#102b55;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:22px;font-weight:850}
.brand small{display:block;font-size:11px;opacity:.75}
.wrap{max-width:1100px;margin:28px auto;padding:0 16px}
.panel{background:white;border:1px solid #e3eaf3;border-radius:16px;padding:20px;margin-bottom:17px}
.auth{max-width:460px;margin:8vh auto}
.muted{color:#718096}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{padding:17px;border-radius:13px;background:#f2f6fc}
.stat b{display:block;font-size:28px;color:#174b91}
.stat span{font-size:13px;color:#718096}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button{background:#e8eef8;color:#174b91}
.tabs button.active{background:#174b91;color:white}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d5deea;border-radius:9px;background:white}
textarea{min-height:75px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.item,.question{border:1px solid #e3eaf3;border-radius:11px;padding:13px;margin:9px 0}
.pill{display:inline-block;background:#eaf1fb;color:#174b91;padding:4px 9px;border-radius:30px;font-size:12px}
.option{display:flex;gap:9px;align-items:center;padding:8px}
.option input{width:auto}
.timer{font-size:22px;font-weight:bold;color:#b83245}
.error{padding:11px;border-radius:9px;background:#ffebee;color:#a21e32;margin:12px 0}
.loading{text-align:center;padding:50px;color:#718096}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawing-wrap{border:1px solid #cbd5e1;border-radius:12px;padding:10px;background:#f8fafc;margin:12px 0}
#drawingCanvas{display:block;width:100%;height:280px;background:white;border:1px solid #cbd5e1;border-radius:8px;touch-action:none;cursor:crosshair}
.draw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.draw-tools input[type=color]{width:45px;height:40px;padding:2px}
.draw-tools input[type=range]{width:110px}
.question-image{display:block;max-width:100%;max-height:320px;object-fit:contain;margin:12px 0;border:1px solid #e3eaf3;border-radius:9px;background:white}
@media(max-width:600px){
 .top{padding:15px;align-items:flex-start;flex-direction:column}
 .wrap{margin:16px auto}
 .panel{padding:16px}
 #drawingCanvas{height:230px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading CBT HUB…</div></div>

<script>
const app=document.getElementById("app");
let me=null,tab="overview",exam=null,answers={},timerId=null,saveId=null;
let drawingData="";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function api(url,opts={}){
 const r=await fetch(url,{
  credentials:"same-origin",
  headers:{"Content-Type":"application/json",...(opts.headers||{})},
  ...opts
 });
 let d={};
 try{d=await r.json()}catch{}
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function headerBar(){
 return `<header class="top">
  <div class="brand">CBT HUB<small>SCHOOL EXAMINATION PORTAL</small></div>
  <div class="right">${me?`
   <span>${esc(me.username)} · ${esc(me.role)}</span>
   <button class="secondary" onclick="logout()">Logout</button>`:""}
  </div>
 </header>`;
}

function shell(body){
 app.innerHTML=headerBar()+`<main class="wrap">${body}</main>`;
}

function errorBox(message){
 return `<div class="error">${esc(message)}</div>`;
}

async function init(){
 try{
  app.innerHTML='<div class="loading">Checking CBT HUB...</div>';
  const status=await api("/api/status");
  me=status.user;

  if(!me){
   authScreen(status.setup);
   return;
  }

  if(me.role==="student")studentHome();
  else dashboard();
 }catch(e){
  shell(`<section class="panel">
   <h2>Unable to load CBT HUB</h2>
   ${errorBox(e.message)}
   <button onclick="init()">Try again</button>
  </section>`);
 }
}

function authScreen(setup){
 const adminForm=setup?`
  <h2>Create administrator account</h2>
  <p class="muted">This first account becomes the CBT HUB administrator.</p>
  <form onsubmit="login(event,true)">
   <label>Admin username</label>
   <input name="username" required minlength="3">
   <label>Password (at least 10 characters)</label>
   <input name="password" type="password" required minlength="10">
   <button style="width:100%;margin-top:16px">Create admin account</button>
  </form>`:`
  <h2>Sign in</h2>
  <form onsubmit="login(event,false)">
   <label>Username</label>
   <input name="username" required minlength="3">
   <label>Password</label>
   <input name="password" type="password" required>
   <button style="width:100%;margin-top:16px">Sign in</button>
  </form>
  <hr style="border:0;border-top:1px solid #e3eaf3;margin:22px 0">
  <h2>New student?</h2>
  <p class="muted">Create your own student account to take examinations.</p>
  <form onsubmit="registerStudent(event)">
   <label>Choose username</label>
   <input name="username" required minlength="3" autocomplete="username">
   <label>Create password (at least 8 characters)</label>
   <input name="password" type="password" required minlength="8" autocomplete="new-password">
   <label>Class</label>
   <input name="className" placeholder="Example: SS2">
   <button class="secondary" style="width:100%;margin-top:14px">Create student account</button>
  </form>`;

 shell(`<section class="panel auth">
  <h1>Welcome to CBT HUB</h1>
  ${adminForm}
 </section>`);
}

async function login(event,isSetup){
 event.preventDefault();
 const form=new FormData(event.target);

 try{
  const data=await api(isSetup?"/api/setup":"/api/login",{
   method:"POST",
   body:JSON.stringify(Object.fromEntries(form))
  });
  me=data.user;
  tab="overview";
  init();
 }catch(e){alert(e.message)}
}

async function registerStudent(event){
 event.preventDefault();
 const form=new FormData(event.target);

 try{
  const data=await api("/api/student/register",{
   method:"POST",
   body:JSON.stringify({
    username:form.get("username"),
    password:form.get("password"),
    className:form.get("className")
   })
  });

  me=data.user;
  studentHome();
 }catch(e){alert(e.message)}
}

async function logout(){
 try{
  await api("/api/logout",{method:"POST"});
  me=null;
  exam=null;
  clearInterval(timerId);
  clearInterval(saveId);
  init();
 }catch(e){alert(e.message)}
}

function dashboard(){
 if(!me||!["admin","teacher"].includes(me.role)){
  return studentHome();
 }

 const tabs=me.role==="admin"
  ?["overview","users","questions","exams","results"]
  :["overview","questions","exams","results"];

 if(!tabs.includes(tab))tab="overview";

 shell(`<h1>${me.role==="admin"?"Admin dashboard":"Teacher dashboard"}</h1>
 <p class="muted">Manage examination activities.</p>
 <nav class="tabs">
 ${tabs.map(t=>`
  <button class="${tab===t?"active":""}" onclick="tab='${t}';dashboard()">
   ${t[0].toUpperCase()+t.slice(1)}
  </button>`).join("")}
 </nav>
 <div id="content"></div>`);

 loadTab();
}

async function loadTab(){
 const el=document.getElementById("content");
 if(!el)return;

 try{
  if(tab==="overview"){
   const [users,questions,exams,results]=await Promise.all([
    me.role==="admin"?api("/api/users"):Promise.resolve([]),
    api("/api/questions"),
    api("/api/exams"),
    api("/api/results")
   ]);

   el.innerHTML=`<div class="grid">
    <div class="stat"><b>${me.role==="admin"?users.length:"—"}</b><span>Accounts</span></div>
    <div class="stat"><b>${questions.length}</b><span>Questions</span></div>
    <div class="stat"><b>${exams.length}</b><span>Your exams</span></div>
    <div class="stat"><b>${results.length}</b><span>Results</span></div>
   </div>
   <section class="panel">
    <h2>Welcome, ${esc(me.username)}</h2>
    <p class="muted">Choose a section above to manage CBT activities.</p>
   </section>`;
  }

  if(tab==="users")await users(el);
  if(tab==="questions")await questions(el);
  if(tab==="exams")await exams(el);
  if(tab==="results")await results(el);

 }catch(e){
  el.innerHTML=errorBox(e.message);
 }
}

 <h2>Create account</h2>
 <form onsubmit="createUser(event)">

   <div><label>Temporary password</label><input name="password" required minlength="8"></div>

    <select name="role">
     <option value="student">Student</option>

    </select>

  <button>Create account</button>

 </section>

 <h2>Accounts</h2>

async function createUser(event){
 event.preventDefault();
 try{
  await api("/api/users",{
   method:"POST",
   body:JSON.stringify(Object.fromEntries(new FormData(event.target)))
  });
  alert("Account created.");
  loadTab();
 }catch(e){alert(e.message)}
}

async function changeUser(id,body){
 try{
  await api("/api/users/"+id,{
   method:"PATCH",
   body:JSON.stringify(body)
  });
  loadTab();
 }catch(e){alert(e.message)}
}

// DRAWING BOARD
function drawingBoard(){
 return `<div class="drawing-wrap">
  <b>Question drawing board</b>
  <p class="muted">Draw with your finger or mouse. Your drawing will be attached to this question.</p>
  <div class="draw-tools">
   <label style="margin:0">Pen colour</label>
   <input type="color" id="penColor" value="#17243b">
   <label style="margin:0">Pen size</label>
   <input type="range" id="penSize" min="1" max="18" value="3">
   <button type="button" class="secondary" onclick="setEraser(false)">Pen</button>
   <button type="button" class="secondary" onclick="setEraser(true)">Eraser</button>
   <button type="button" class="danger" onclick="clearDrawing()">Clear board</button>
  </div>
  <canvas id="drawingCanvas" width="1000" height="440"></canvas>
  <p class="muted">Optional: leave the board blank if the question does not need a diagram.</p>
 </div>`;
}

let canvasEraser=false;
let canvasDrawing=false;
let lastPoint=null;

function setupDrawingBoard(){
 const canvas=document.getElementById("drawingCanvas");
 if(!canvas)return;

 const ctx=canvas.getContext("2d");
 ctx.lineCap="round";
 ctx.lineJoin="round";

 canvas.addEventListener("pointerdown",event=>{
  canvasDrawing=true;
  canvas.setPointerCapture(event.pointerId);
  lastPoint=getCanvasPoint(canvas,event);
 });

 canvas.addEventListener("pointermove",event=>{
  if(!canvasDrawing||!lastPoint)return;

  const point=getCanvasPoint(canvas,event);
  ctx.beginPath();
  ctx.moveTo(lastPoint.x,lastPoint.y);
  ctx.lineTo(point.x,point.y);
  ctx.lineWidth=Number(document.getElementById("penSize")?.value||3);
  ctx.strokeStyle=document.getElementById("penColor")?.value||"#17243b";
  ctx.globalCompositeOperation=canvasEraser?"destination-out":"source-over";
  ctx.stroke();
  lastPoint=point;
 });

 function stopDrawing(){
  canvasDrawing=false;
  lastPoint=null;
  ctx.globalCompositeOperation="source-over";
 }

 canvas.addEventListener("pointerup",stopDrawing);
 canvas.addEventListener("pointercancel",stopDrawing);
 canvas.addEventListener("lostpointercapture",stopDrawing);
}

function getCanvasPoint(canvas,event){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(event.clientX-rect.left)*(canvas.width/rect.width),
  y:(event.clientY-rect.top)*(canvas.height/rect.height)
 };
}

function setEraser(value){
 canvasEraser=value;
}

function clearDrawing(){
 const canvas=document.getElementById("drawingCanvas");
 if(!canvas)return;
 canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}

// QUESTION MANAGEMENT
async function questions(el){
 const list=await api("/api/questions");

 el.innerHTML=`<section class="panel">
 <h2>Add a question</h2>
 <form id="questionForm" onsubmit="addQuestion(event)">
  <label>Question</label>
  <textarea name="text" required></textarea>

  <div class="formgrid">
   ${[0,1,2,3].map(i=>`
    <div>
     <label>Option ${"ABCD"[i]}</label>
     <input name="o${i}" required>
    </div>`).join("")}
  </div>

  <div class="formgrid">
   <div><label>Correct option</label>
    <select name="answer">
     <option value="0">A</option>
     <option value="1">B</option>
     <option value="2">C</option>
     <option value="3">D</option>
    </select>
   </div>
   <div><label>Subject</label><input name="subject" placeholder="Mathematics"></div>
   <div><label>Class</label><input name="className" placeholder="SS2"></div>
   <div><label>Topic</label><input name="topic"></div>
  </div>

  ${drawingBoard()}
  <button type="submit">Save question</button>
 </form>
 </section>

 <section class="panel">
 <h2>Question bank (${list.length})</h2>
 ${list.map(q=>`<div class="item">
  <b>${esc(q.text)}</b>
  ${q.image?`<img class="question-image" src="${q.image}" alt="Question diagram">`:""}
  <p class="muted">${esc(q.subject)} · ${esc(q.className)} · ${esc(q.topic)}</p>
  ${q.answer===undefined?"":`<span class="pill">Answer: ${"ABCD"[q.answer]}</span>`}
  <button class="danger" style="float:right" onclick="deleteQuestion('${q.id}')">Delete</button>
  <div style="clear:both"></div>
 </div>`).join("")||"<p>No questions saved yet.</p>"}
 </section>`;

 setupDrawingBoard();
}

async function addQuestion(event){
 event.preventDefault();

 const form=new FormData(event.target);
 const canvas=document.getElementById("drawingCanvas");
 let image="";

 if(canvas){
  const ctx=canvas.getContext("2d");
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let hasDrawing=false;

  for(let i=3;i<pixels.length;i+=4){
   if(pixels[i]!==0){hasDrawing=true;break}
  }

  if(hasDrawing)image=canvas.toDataURL("image/png");
 }

 try{
  await api("/api/questions",{
   method:"POST",
   body:JSON.stringify({
    text:form.get("text"),
    options:[0,1,2,3].map(i=>form.get("o"+i)),
    answer:form.get("answer"),
    subject:form.get("subject"),
    className:form.get("className"),
    topic:form.get("topic"),
    image
   })
  });

  alert("Question saved successfully.");
  loadTab();
 }catch(e){alert(e.message)}
}

async function deleteQuestion(id){
 if(!confirm("Delete this question?"))return;

 try{
  await api("/api/questions/"+id,{method:"DELETE"});
  loadTab();
 }catch(e){alert(e.message)}
}

 ]);

  <div class="formgrid">

async function createExam(event){
 event.preventDefault();
 const form=new FormData(event.target);

 try{
  const data=await api("/api/exams",{
   method:"POST",
   body:JSON.stringify({
    title:form.get("title"),
    className:form.get("className"),
    duration:form.get("duration"),
    expiryHours:form.get("expiryHours"),
    questionIds:form.getAll("questionIds")
   })
  });

  alert("Exam created. Code: "+data.exam.code);
  loadTab();
 }catch(e){alert(e.message)}
}

async function controlExam(id,action){
 try{
  await api("/api/exams/"+id+"/control",{
   method:"POST",
   body:JSON.stringify({action})
  });
  alert("Exam "+action+" command completed.");
  loadTab();
 }catch(e){alert(e.message)}
}

async function monitor(id){
 try{
  const data=await api("/api/exams/"+id+"/monitor");
  alert(
   `${data.title}\nStatus: ${data.status}\nStudents: ${data.students.length}\n`+
   data.students.map(s=>s.student+": "+s.status).join("\n")
  );
 }catch(e){alert(e.message)}
}

// STUDENT PORTAL
function studentHome(){
 exam=null;
 shell(`<section class="panel">
  <h1>Student portal</h1>
  <p>Welcome, <b>${esc(me.username)}</b></p>
  <p class="muted">Class: ${esc(me.className||"Not specified")}</p>
  <p class="muted">Enter the exam code provided by your teacher when the exam is open.</p>
  <form onsubmit="startExam(event)">
   <label>Exam code</label>
   <input name="code" required maxlength="12" autocapitalize="characters">
   <button style="margin-top:12px">Enter exam</button>
  </form>
 </section>`);
}

async function startExam(event){
 event.preventDefault();

 try{
  exam=await api("/api/student/start",{
   method:"POST",
   body:JSON.stringify({
    code:new FormData(event.target).get("code")
   })
  });

  answers={...exam.answers};
  renderExam();
 }catch(e){alert(e.message)}
}

// STUDENT EXAM DISPLAY
function renderExam(){
 clearInterval(timerId);
 clearInterval(saveId);

 let seconds=exam.duration*60;

 shell(`<section class="panel">
  <div class="row" style="justify-content:space-between">
   <div>
    <h1>${esc(exam.title)}</h1>
    <p class="muted">Answer all questions, then submit.</p>
   </div>
   <div class="timer" id="timer">${Math.floor(seconds/60)}:00</div>
  </div>

  <div id="paper">
   ${exam.questions.map((q,i)=>`<div class="question">
    <b>${i+1}. ${esc(q.text)}</b>
    ${q.image?`<img class="question-image" src="${q.image}" alt="Question diagram">`:""}
    ${q.options.map((option,j)=>`
     <label class="option">
      <input type="radio" name="${q.id}" value="${j}"
       ${String(answers[q.id])===String(j)?"checked":""}
       onchange="answers['${q.id}']=this.value">
      ${"ABCD"[j]}. ${esc(option)}
     </label>`).join("")}
   </div>`).join("")}
  </div>

  <button onclick="submitExam()">Submit exam</button>
 </section>`);

 timerId=setInterval(()=>{
  seconds--;
  const timer=document.getElementById("timer");

  if(timer){
   timer.textContent=
    Math.floor(Math.max(0,seconds)/60)+":"+
    String(Math.max(0,seconds)%60).padStart(2,"0");
  }

  if(seconds<=0){
   clearInterval(timerId);
   submitExam(true);
  }
 },1000);

 saveId=setInterval(()=>{
  if(exam){
   api("/api/student/save",{
    method:"POST",
    body:JSON.stringify({
     examId:exam.examId,
     answers
    })
   }).catch(()=>{});
  }
 },15000);
}

async function submitExam(auto=false){
 if(!exam)return;
 if(!auto&&!confirm("Submit your exam now?"))return;

 const submittedExam=exam;

 try{
  const result=await api("/api/student/submit",{
   method:"POST",
   body:JSON.stringify({
    examId:submittedExam.examId,
    answers
   })
  });

  clearInterval(timerId);
  clearInterval(saveId);
  exam=null;

  shell(`<section class="panel">
   <h1>Exam submitted</h1>
   <div class="stat">
    <b>${result.score}/${result.total}</b>
    <span>Your score · ${result.percentage}%</span>
   </div>
   <p>Your answers have been submitted successfully.</p>
   <button onclick="studentHome()">Back to portal</button>
  </section>`);
 }catch(e){
  alert(e.message);
 }
}

init();
</script>
</body>
</html>
